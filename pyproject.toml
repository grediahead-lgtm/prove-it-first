[project]
name = "prove-it-first"
version = "0.1.0"
description = "A tiny kit for testing trading ideas honestly: pre-registered rules, costs, block results and a sieve."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dmytro Grechyshchev" }]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Intended Audience :: Education"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
